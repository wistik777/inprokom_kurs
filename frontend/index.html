<!DOCTYPE html>
<html lang="ru">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>НПП Инпроком — разработка и производство инженерной продукции</title>
        <meta
            name="description"
            content="НПП «ИНПРОКОМ» — разработчик и производитель оборудования для безопасности и промышленности: охрана периметра, ОПУ, пожарные системы, контрактное производство. С 1992 года."
        />
        <link rel="icon" href="/img/favicone.svg" type="image/svg+xml" />
        <style>
            #site-preloader {
                position: fixed;
                inset: 0;
                z-index: 99999;
                display: flex;
                align-items: center;
                justify-content: center;
                background: #fff;
            }
            html[data-skip-preloader] #site-preloader {
                display: none !important;
            }
            html[data-skip-preloader] body.site-loading #app {
                opacity: 1 !important;
            }
            html[data-skip-preloader] body.site-loading {
                overflow: visible !important;
            }
            .site-preloader__inner {
                display: flex;
                flex-direction: column;
                align-items: stretch;
                width: min(88vw, 380px);
                padding: 0 20px;
            }
            .site-preloader__logo {
                display: block;
                width: 100%;
                height: auto;
            }
            .site-preloader__bar {
                margin-top: 22px;
                width: 100%;
                height: 3px;
                overflow: hidden;
                border-radius: 999px;
                background: #7d211e;
            }
            .site-preloader__bar-fill {
                display: block;
                height: 100%;
                width: 100%;
                border-radius: inherit;
                background: #fa4234;
                transform-origin: left center;
                transform: scaleX(0);
                animation: site-preloader-progress 1.6s ease-out forwards;
            }
            @keyframes site-preloader-progress {
                0% { transform: scaleX(0); }
                18% { transform: scaleX(0.22); }
                45% { transform: scaleX(0.48); }
                72% { transform: scaleX(0.72); }
                100% { transform: scaleX(0.88); }
            }
            body.site-loading {
                overflow: hidden;
            }
            body.site-loading #app {
                opacity: 0;
            }
        </style>
        <script>
            try {
                if (sessionStorage.getItem('inprokom.skipSitePreloader') === '1') {
                    document.documentElement.dataset.skipPreloader = '1';
                }
            } catch (e) {}
        </script>
    </head>
    <body class="site-loading">
        <div id="site-preloader" role="status" aria-live="polite" aria-label="Загрузка сайта">
            <div class="site-preloader__inner">
                <img
                    class="site-preloader__logo"
                    src="/img/logo.svg"
                    width="262"
                    height="70"
                    alt="Инпроком"
                    decoding="async"
                />
                <div class="site-preloader__bar" aria-hidden="true">
                    <span class="site-preloader__bar-fill"></span>
                </div>
            </div>
        </div>
        <div id="app"></div>
        <script>
            if (document.documentElement.dataset.skipPreloader === '1') {
                document.body.classList.remove('site-loading');
                document.body.classList.add('site-ready');
                document.getElementById('site-preloader')?.remove();
            }
        </script>
        <script type="module" src="/src/main.jsx"></script>
    </body>
</html>
